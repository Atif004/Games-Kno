<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالم الألعاب المجانية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    header p {
      color: #00f2fe;
      font-size: 0.95rem;
    }
    .ad-box {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px 10px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, background 0.2s;
    }
    .game-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }
    .game-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
      display: block;
    }
    .game-title {
      font-size: 1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 عالم الألعاب المجانية</h1>
    <p>اختر لعبتك المفضلة وابدأ اللعب فوراً!</p>
  </header>

  <div class="ad-box">مساحة إعلانية</div>

  <main class="games-grid">
    <a href="#" class="game-card">
      <span class="game-icon">❌⭕</span>
      <span class="game-title">لعبة XO Kids</span>
    </a>
    <a href="#" class="game-card">
      <span class="game-icon">⚡</span>
      <span class="game-title">لعبة ركز واضغط</span>
    </a>
    <a href="#" class="game-card">
      <span class="game-icon">🎯</span>
      <span class="game-title">لعبة صيد الهدف</span>
    </a>
  </main>

</body>
</html>
